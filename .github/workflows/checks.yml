name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: reconcile_test
          POSTGRES_USER: reconcile
          POSTGRES_PASSWORD: ci_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reconcile -d reconcile_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reconcile:ci_test_only@127.0.0.1:5432/reconcile_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: reconcile-ci-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_DIR: artifacts/docker
      RUNTIME_DESCRIPTION: GitHub Actions Linux Docker Compose (PostgreSQL, FastAPI, Nginx)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated configuration and browser
        run: |
          sh scripts/init-env.sh
          docker compose config --quiet
          npm install --prefix "$RUNNER_TEMP/reconcile-browser" playwright@1.62.1
          "$RUNNER_TEMP/reconcile-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/reconcile-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Build and start the actual application stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Browser uploads, comparison, provenance and XLSX export
        run: node scripts/browser-smoke.cjs
      - name: Save and reuse templates with reordered columns and missing fields
        run: node scripts/browser-templates.cjs
      - name: Capture persisted history and original files
        run: python scripts/check-persistence.py capture --require-template
      - name: Recreate all containers with the existing volume
        run: |
          docker compose down --timeout 35
          docker compose up -d --wait --wait-timeout 180
          python scripts/check-persistence.py verify --require-template
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p artifacts/docker
          docker compose logs --no-color > artifacts/docker/services.log
          docker compose ps --format json > artifacts/docker/containers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/docker
          retention-days: 14
      - name: Remove only this job's temporary stack and volume
        if: always()
        run: docker compose down -v --timeout 35
